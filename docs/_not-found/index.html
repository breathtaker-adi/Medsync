ck"},"featureList":["AI Prescription Camera OCR Intake","WCAG AAA Senior Mode with 64px Touch Targets","Encrypted Cloud Database with PostgreSQL Row-Level Security","Caregiver Missed-Dose Escalation Push Alerts","Clinician Prescription Verification Loop","DPDP Act 2023 Aligned Architecture with Zero Ad Brokers","Offline-First Exact Alarm Manager Reminders"],"author":{"@type":"Person","name":"Aditya Kumawat","url":"https://github.com/breathtaker-adi"},"publisher":{"@id":"https://breathtaker-adi.github.io/Medsync/#org"},"license":"https://opensource.org/licenses/MIT"},{"@type":"MedicalWebPage","@id":"https://breathtaker-adi.github.io/Medsync/#medical","name":"Medsync Medication Adherence Architecture & Clinical Safety Loop","url":"https://breathtaker-adi.github.io/Medsync/","medicalAudience":[{"@type":"MedicalAudience","audienceType":"Patient"},{"@type":"MedicalAudience","audienceType":"Caregiver"},{"@type":"MedicalAudience","audienceType":"Clinician"}],"aspect":["Overview","Prescription OCR Intake","Doctor Verification Loop","Caregiver Missed-Dose Push Alerts","DPDP Act 2023 Compliance","Offline Alarm Resilience"]},{"@type":"HowTo","@id":"https://breathtaker-adi.github.io/Medsync/#howto","name":"How to Set Up Automated Medication Adherence & Caregiver Alerts with MedSync","description":"Step-by-step guide to scanning paper prescriptions, establishing physician verification, and enabling family caregiver missed-dose alerts.","step":[{"@type":"HowToStep","position":1,"name":"Scan Paper Prescription with AI Camera OCR","text":"Open MedSync and photograph your doctor prescription slip or medicine box. The AI Vision edge function parses medicine name, strength, dosage, and duration into a draft schedule."},{"@type":"HowToStep","position":2,"name":"Confirm Regimen via Doctor Care Loop","text":"Review the extracted dosage draft. The schedule enters active status only after confirmation by the patient or a licensed medical practitioner."},{"@type":"HowToStep","position":3,"name":"Link Family Caregiver for Missed-Dose Push Alerts","text":"Generate a 15-minute pairing code for a family caregiver. If a critical dose is missed past a 60-minute window, the caregiver receives an encrypted alert."}]},{"@type":"WebSite","@id":"https://breathtaker-adi.github.io/Medsync/#website","url":"https://breathtaker-adi.github.io/Medsync/","name":"Medsync","description":"Smart Medication Adherence, AI Prescription OCR & Caregiver Platform","publisher":{"@id":"https://breathtaker-adi.github.io/Medsync/#org"},"inLanguage":"en-US","speakable":{"@type":"SpeakableSpecification","cssSelector":["#main-content h1","#main-content .hero-sub","#faq"]}},{"@type":"BreadcrumbList","@id":"https://breathtaker-adi.github.io/Medsync/#breadcrumb","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":"https://breathtaker-adi.github.io/Medsync/"},{"@type":"ListItem","position":2,"name":"FAQ & Safety","item":"https://breathtaker-adi.github.io/Medsync/faq/"},{"@type":"ListItem","position":3,"name":"Privacy Policy","item":"https://breathtaker-adi.github.io/Medsync/privacy/"}]},{"@type":"FAQPage","@id":"https://breathtaker-adi.github.io/Medsync/#faq","mainEntity":[{"@type":"Question","name":"How does MedSync protect my personal health data under India's DPDP Act 2023?","acceptedAnswer":{"@type":"Answer","text":"MedSync is architected around the core data protection principles of India's Digital Personal Data Protection (DPDP) Act 2023. Health schedules and records are stored in a secure Supabase PostgreSQL cloud database protected by strict Row-Level Security (RLS) policies, with session tokens safeguarded by your phone's hardware Keystore via SecureStore. We never deploy tracking cookies, advertising SDKs, or broker data to third parties. Under Section 12 of the DPDP Act 2023, you retain the right to export your records or permanently delete your account and all associated data on demand."}},{"@type":"Question","name":"What happens if I lose internet connection or take doses in remote areas?","acceptedAnswer":{"@type":"Answer","text":"MedSync schedules dose alarms natively on your Android device using exact alarm managers, ensuring reminders trigger reliably even without an active internet connection. On-device caches allow you to view current schedules offline. When network connectivity is restored, dose confirmations synchronize with linked family caregivers. A dedicated offline dose logging queue is currently under active development."}},{"@type":"Question","name":"Can MedSync's AI automatically change my medication dosages?","acceptedAnswer":{"@type":"Answer","text":"Never. MedSync strictly enforces the Doctor Care Loop safety guardrail. When you scan a prescription, our serverless AI Vision edge function extracts medication names, dosage strengths, and timing into a proposed schedule draft. However, no schedule goes live without explicit confirmation and digital verification by a registered medical practitioner or designated caregiver."}},{"@type":"Question","name":"How does Caregiver Escalation work if a patient misses a critical dose?","acceptedAnswer":{"@type":"Answer","text":"For chronic or high-risk therapies, patients can pair trusted family caregivers using a secure, temporary 15-minute pairing code. If a scheduled dose is not logged as taken within the grace window (30 to 60 minutes), MedSync dispatches an encrypted push alert directly to the caregiver's device via Firebase Cloud Messaging so family members can check in."}},{"@type":"Question","name":"Is MedSync open source, and how can I verify its security?","acceptedAnswer":{"@type":"Answer","text":"Yes. MedSync is 100% open source under the permissive MIT License. The complete source code for our React Native mobile application, Next.js web application, Supabase database migrations, Row-Level Security policies, and edge functions is publicly auditable on GitHub."}},{"@type":"Question","name":"How can I export or permanently purge my medical data?","acceptedAnswer":{"@type":"Answer","text":"You retain full data sovereignty under Section 11 and 12 of the DPDP Act 2023. Inside app settings, you can tap 'Export Vault JSON' to generate a standardized, machine-readable export of your prescription history and adherence logs. You can also select 'Delete Account' to trigger a permanent cascading deletion of all your database records, caregiver pairings, push tokens, and prescription images across both local storage and cloud servers."}},{"@type":"Question","name":"How does MedSync's Senior Mode ensure accessibility for elderly patients?","acceptedAnswer":{"@type":"Answer","text":"MedSync features a dedicated Senior Mode designed to WCAG AAA standards. It provides generous 64px minimum touch targets, high-contrast text and cards, haptic feedback on dose confirmation, and large, unambiguous 'I Took It' buttons that eliminate cognitive overload for aging seniors."}},{"@type":"Question","name":"Where can I download the MedSync Android APK, and what are the system requirements?","acceptedAnswer":{"@type":"Answer","text":"Official, signed Android APK releases are available for direct download on MedSync's official GitHub Releases repository (https://github.com/breathtaker-adi/Medsync/releases). MedSync supports Android 8.0 (API level 26) through Android 15, requiring approximately 108MB of storage."}}]}]}</script><noscript><style>

osages?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Never. MedSync strictly enforces the Doctor Care Loop safety guardrail. When you scan a prescription, our serverless AI Vision edge function extracts medication names, dosage strengths, and timing into a proposed schedule draft. However, no schedule goes live without explicit confirmation and digital verification by a registered medical practitioner or designated caregiver.\"}},{\"@type\":\"Question\",\"name\":\"How does Caregiver Escalation work if a patient misses a critical dose?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"For chronic or high-risk therapies, patients can pair trusted family caregivers using a secure, temporary 15-minute pairing code. If a scheduled dose is not logged as taken within the grace window (30 to 60 minutes), MedSync dispatches an encrypted push alert directly to the caregiver's device via Firebase Cloud Messaging so family members can check in.\"}},{\"@type\":\"Question\",\"name\":\"Is MedSync open source, and how can I verify its security?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Yes. MedSync is 100% open source under the permissive MIT License. The complete source code for our React Native mobile application, Next.js web application, Supabase database migrations, Row-Level Security policies, and edge functions is publicly auditable on GitHub.\"}},{\"@type\":\"Question\",\"name\":\"How can I export or permanently purge my medical data?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"You retain full data sovereignty under Section 11 and 12 of the DPDP Act 2023. Inside app settings, you can tap 'Export Vault JSON' to generate a standardized, machine-readable export of your prescription history and adherence logs. You can also select 'Delete Account' to trigger a permanent cascading deletion of all your database records, caregiver pairings, push tokens, and prescription images across both local storage and cloud servers.\"}},{\"@type\":\"Question\",\"name\":\"How does MedSync's Senior Mode ensure accessibility for elderly patients?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"MedSync features a dedicated Senior Mode designed to WCAG AAA standards. It provides generous 64px minimum touch targets, high-contrast text and cards, haptic feedback on dose confirmation, and large, unambiguous 'I Took It' buttons that eliminate cognitive overload for aging seniors.\"}},{\"@type\":\"Question\",\"name\":\"Where can I download the MedSync Android APK, and what are the system requirements?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Official, signed Android APK releases are available for direct download on MedSync's official GitHub Releases repository (https://github.com/breathtaker-adi/Medsync/releases). MedSync supports Android 8.0 (API level 26) through Android 15, requiring approximately 108MB of storage.\"}}]}]}"])</script><script>self.__next_f.push([1,"7:X\n8:[[\"children\",{\"s\":\"__PAGE__\",\"h\":512,\"d\":{\"r\":\"$L9\",\"p\":false,\"v\":null}}]]\n5:[[\"children\",{\"s\":\"_not-found\",\"h\":512,\"d\":{\"r\":\"$L6\",\"p\":false,\"v\":\"$7\"},\"c\":\"$Q8\"}]]\n"])</script><script>self.__next_f.push([1,"0:{\"P\":null,\"c\":[\"\",\"_not-found\",\"\"],\"q\":\"\",\"i\":false,\"t\":{\"t\":{\"s\":\"\",\"h\":528,\"d\":{\"r\":[\"$\",\"$1\",\"c\",{\"children\":[[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/Medsync/_next/static/css/a7f7c41e7d8ccf6c.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]],[\"$\",\"html\",null,{\"lang\":\"en\",\"suppressHydrationWarning\":true,\"className\":\"dark\",\"children\":[[\"$\",\"head\",null,{\"children\":[[\"$\",\"meta\",null,{\"http-equiv\":\"Content-Security-Policy\",\"content\":\"default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self'; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none';\"}],[\"$\",\"link\",null,{\"rel\":\"i
